<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1480" height="900" viewBox="0 0 1480 900">
  <!-- Phlox deployment topologies and code-execution sandbox options. Fred Hutch brand palette: navy #1B365D, cyan #00ABC8, purple #AA4AC4, gold #FFB500. -->
  <!-- Editable SVG: plain shapes + text, no CSS classes, filters, or markers, for clean Visio / Illustrator import. -->
  <rect x="0" y="0" width="1480" height="900" fill="#FFFFFF"/>

  <!-- Title block -->
  <g id="title-block">
    <rect x="0" y="0" width="1480" height="56" fill="#1B365D"/>
    <rect x="0" y="56" width="1480" height="4" fill="#FFB500"/>
    <text x="40" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Phlox — Deployment Topologies &amp; Code-Execution Sandbox</text>
    <text x="1440" y="36" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#BFD3E6">Fred Hutchinson Cancer Center · July 2026</text>
  </g>

  <!-- Panel A: development -->
  <g id="panel-dev">
    <rect x="40" y="90" width="440" height="430" rx="10" fill="#F7F9FC" stroke="#C6D0DD" stroke-width="1"/>
    <text x="56" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1B365D" letter-spacing="1">DEVELOPMENT — TWO PROCESSES</text>

    <rect x="70" y="136" width="380" height="54" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="260" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">Browser</text>
    <text x="260" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">http://localhost:5173</text>
    <line x1="260" y1="190" x2="260" y2="216" stroke="#1B365D" stroke-width="1.5"/>
    <polygon points="260,224 256,215 264,215" fill="#1B365D"/>

    <rect x="70" y="224" width="380" height="66" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="260" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">Vite dev server — :5173</text>
    <text x="260" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">hot reload · proxies /api → :8000</text>
    <text x="260" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">frontend/ — npm run dev</text>
    <line x1="260" y1="290" x2="260" y2="316" stroke="#1B365D" stroke-width="1.5"/>
    <polygon points="260,324 256,315 264,315" fill="#1B365D"/>
    <text x="272" y="312" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7A90">/api proxy</text>

    <rect x="70" y="324" width="380" height="66" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="260" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">uvicorn app.main:app --reload — :8000</text>
    <text x="260" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">FastAPI backend · backend/ — uv run</text>
    <text x="260" y="381" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">SQLite + embedded Qdrant under backend/data/</text>

    <text x="70" y="426" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">launchers: scripts/dev.sh (POSIX) · scripts/dev.ps1 (Windows)</text>
    <text x="70" y="444" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">auth on by default (admin/admin seeded) — or auth.enabled: false</text>
  </g>

  <!-- Panel B: host / systemd -->
  <g id="panel-host">
    <rect x="520" y="90" width="440" height="430" rx="10" fill="#F7F9FC" stroke="#C6D0DD" stroke-width="1"/>
    <text x="536" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1B365D" letter-spacing="1">PRODUCTION ON LINUX — SYSTEMD (DEPLOYMENT.md)</text>

    <rect x="550" y="136" width="380" height="60" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="740" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">nginx / Caddy — TLS :443</text>
    <text x="740" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">proxy_buffering off (SSE) · certbot / your CA</text>
    <line x1="740" y1="196" x2="740" y2="222" stroke="#1B365D" stroke-width="1.5"/>
    <polygon points="740,230 736,221 744,221" fill="#1B365D"/>

    <rect x="550" y="230" width="380" height="88" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="740" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">phlox.service — one Uvicorn process</text>
    <text x="740" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">bound to 127.0.0.1:8000 · serves API + built SPA</text>
    <text x="740" y="287" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">dedicated phlox user · systemd hardening</text>
    <text x="740" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">secrets via /etc/phlox/phlox.env (PHLOX_JWT_SECRET)</text>
    <line x1="740" y1="318" x2="740" y2="344" stroke="#1B365D" stroke-width="1.5"/>
    <polygon points="740,352 736,343 744,343" fill="#1B365D"/>

    <rect x="550" y="352" width="380" height="60" rx="8" fill="#E9F8FB" stroke="#00ABC8" stroke-width="1.5"/>
    <text x="740" y="374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">backend/data/ — SQLite · Qdrant · workspaces</text>
    <text x="740" y="393" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">or Postgres via DATABASE_URL (data stays off-box)</text>

    <text x="550" y="438" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">single process required — embedded Qdrant locks its dir (no --workers)</text>
    <text x="550" y="456" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">optional: rootless Podman for the container sandbox (see below)</text>
  </g>

  <!-- Panel C: container -->
  <g id="panel-container">
    <rect x="1000" y="90" width="440" height="430" rx="10" fill="#F7F9FC" stroke="#C6D0DD" stroke-width="1"/>
    <text x="1016" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1B365D" letter-spacing="1">PRODUCTION IN A CONTAINER (DOCKER.md)</text>

    <rect x="1030" y="136" width="380" height="88" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="1220" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">phlox:latest — single image, port 8000</text>
    <text x="1220" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">FastAPI + built SPA in one process (tini → uvicorn)</text>
    <text x="1220" y="193" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">Docker or Podman — CLI-compatible, rootless OK</text>
    <text x="1220" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">postgres driver baked in (--extra postgres)</text>
    <line x1="1220" y1="224" x2="1220" y2="250" stroke="#1B365D" stroke-width="1.5"/>
    <polygon points="1220,258 1216,249 1224,249" fill="#1B365D"/>

    <rect x="1030" y="258" width="380" height="70" rx="8" fill="#E9F8FB" stroke="#00ABC8" stroke-width="1.5"/>
    <text x="1220" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">Bind mounts — state lives on the host</text>
    <text x="1220" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">./backend/config.yml → /app/backend/config.yml</text>
    <text x="1220" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">./backend/data → /app/backend/data</text>

    <rect x="1030" y="348" width="380" height="86" rx="8" fill="#FFFAEC" stroke="#FFB500" stroke-width="1.5"/>
    <text x="1220" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1B365D">Optional compose profiles</text>
    <text x="1220" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">--profile with-qdrant → qdrant/qdrant server</text>
    <text x="1220" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">--profile with-postgres → postgres:16</text>
    <text x="1220" y="421" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">local model on host: endpoint = host.docker.internal</text>

    <text x="1030" y="456" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">sandbox.runner: local only here — the Phlox container is the boundary</text>
  </g>

  <!-- Sandbox band -->
  <g id="sandbox-band">
    <rect x="40" y="556" width="1400" height="270" rx="10" fill="#FBF5FD" stroke="#AA4AC4" stroke-width="1.5" stroke-dasharray="7,4"/>
    <text x="56" y="582" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1B365D" letter-spacing="1">CODE-EXECUTION SANDBOX — sandbox.runner IN config.yml (FILE-ONLY, NEVER UI-EDITABLE) · SANDBOX.md</text>

    <rect x="70" y="606" width="430" height="170" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="84" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1B365D">local <tspan font-weight="normal" font-size="11" fill="#6B7A90">(default)</tspan></text>
    <text x="84" y="652" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">subprocess on the Phlox host</text>
    <text x="84" y="669" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">rooted in the conversation workspace</text>
    <text x="84" y="686" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">timeouts + output caps</text>
    <text x="84" y="703" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">trusts the host</text>
    <text x="84" y="728" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">for: single-user · local · trusted dev</text>

    <rect x="525" y="606" width="430" height="170" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="539" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1B365D">container</text>
    <text x="539" y="652" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">ephemeral Podman/Docker container per run (--rm)</text>
    <text x="539" y="669" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">workspace bind-mounted at /work</text>
    <text x="539" y="686" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">cpu · memory · pids caps · network: none</text>
    <text x="539" y="703" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">batteries-included images opt-in (docker/sandbox/)</text>
    <text x="539" y="728" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">for: untrusted input · multi-user, on your own host</text>

    <rect x="980" y="606" width="430" height="170" rx="8" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="994" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1B365D">agentcore</text>
    <text x="994" y="652" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">AWS Bedrock AgentCore Code Interpreter</text>
    <text x="994" y="669" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">Firecracker microVM — kernel-level isolation, off-host</text>
    <text x="994" y="686" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">workspace synced in/out per run · session per conversation</text>
    <text x="994" y="703" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">falls back to local on AWS error</text>
    <text x="994" y="728" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#6B7A90">for: untrusted/multi-user with no local container engine</text>

    <line x1="84" y1="796" x2="1392" y2="796" stroke="#AA4AC4" stroke-width="2"/>
    <polygon points="1400,796 1390,791 1390,801" fill="#AA4AC4"/>
    <text x="740" y="789" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#AA4AC4">increasing isolation →</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <text x="40" y="856" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1B365D">LEGEND</text>
    <rect x="110" y="844" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#1B365D" stroke-width="1.5"/>
    <text x="134" y="857" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">Phlox component / process</text>
    <rect x="330" y="844" width="16" height="16" rx="3" fill="#E9F8FB" stroke="#00ABC8" stroke-width="1.5"/>
    <text x="354" y="857" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">persistent state</text>
    <rect x="490" y="844" width="16" height="16" rx="3" fill="#FFFAEC" stroke="#FFB500" stroke-width="1.5"/>
    <text x="514" y="857" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">optional external service</text>
    <line x1="700" y1="852" x2="744" y2="852" stroke="#AA4AC4" stroke-width="1.5" stroke-dasharray="7,4"/>
    <text x="754" y="857" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#44546A">isolation / security boundary</text>
  </g>
</svg>
